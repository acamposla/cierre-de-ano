[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cierre-de-ano"
version = "1.0.0"
description = "Un cierre de año para dirección: ¿crecemos sano y dónde se pierde el margen? Datos sintéticos."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["cierre"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["cierre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
